; Claude Talkie firmware
;
;   pio run -e receiver -t upload     ; XIAO ESP32C3 (USB dongle on the Mac)
;   pio run -e stick -t upload        ; M5StickS3 (push-to-talk)
;
; Flash one device at a time, or add --upload-port /dev/cu.usbmodemXXXX.
; Both builds share include/talkie_config.h and the generated
; include/talkie_secret.h, so always build them from this same folder.

[platformio]
default_envs = receiver, stick

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/gen_secret.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wno-unused-function

[env:stick]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_src_filter = +<stick/>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5GFX@0.2.33
    m5stack/M5Unified@0.2.26

[env:receiver]
board = seeed_xiao_esp32c3
build_src_filter = +<receiver/>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
